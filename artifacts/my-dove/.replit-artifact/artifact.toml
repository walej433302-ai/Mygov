kind = "web"
previewPath = "/"
title = "My Dove – Victorian Health App"
version = "1.0.0"
id = "artifacts/my-dove"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19093

[services.development]
run = "pnpm --filter @workspace/my-dove run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/my-dove", "run", "build" ]
serve = "static"
publicDir = "artifacts/my-dove/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19093"
BASE_PATH = "/"
